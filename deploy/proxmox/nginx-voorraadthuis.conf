server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/voorraadthuis/public;
    index index.html;
    charset utf-8;
    # De webpagina staat in public/; daarboven liggen alleen serverbestanden.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js { default_type text/javascript; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "same-origin" always; }
    location /api/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/ssl/voorraadthuis/cert.pem;
    ssl_certificate_key /etc/ssl/voorraadthuis/key.pem;
    root /var/www/voorraadthuis/public;
    index index.html;
    charset utf-8;
    # De webpagina staat in public/; daarboven liggen alleen serverbestanden.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /manifest.webmanifest { default_type application/manifest+json; }
    location = /sw.js { default_type text/javascript; add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; add_header Referrer-Policy "same-origin" always; }
    location /api/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
