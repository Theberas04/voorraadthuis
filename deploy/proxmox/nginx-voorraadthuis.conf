server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/voorraadthuis;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_certificate /etc/ssl/voorraadthuis/cert.pem;
    ssl_certificate_key /etc/ssl/voorraadthuis/key.pem;
    root /var/www/voorraadthuis;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location /api/ { proxy_pass http://127.0.0.1:3000; proxy_http_version 1.1; proxy_set_header Host $host; }
    location / { try_files $uri $uri/ /index.html; }
}
