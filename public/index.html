<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173c32"><title>VoorraadThuis</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#1c2822;background:#f5f4ef;font-synthesis:none}*{box-sizing:border-box}body{margin:0}.top{background:#173c32;color:white;padding:26px max(calc((100% - 1060px)/2),22px) 30px}.brand{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#b9d2a3;font-weight:750}.top h1{font-size:clamp(28px,5vw,44px);margin:8px 0 5px;letter-spacing:-.04em}.top p{margin:0;color:#d6e4da}.wrap{max-width:1060px;margin:28px auto;padding:0 20px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}.stat,.panel{background:white;border:1px solid #e7e8e1;border-radius:16px;padding:18px}.stat{color:#647169;font-size:13px}.stat strong{display:block;color:#173c32;font-size:28px;margin-top:4px}.layout{display:grid;grid-template-columns: minmax(280px,.86fr) minmax(0,1.5fr);gap:18px}.panel h2{font-size:18px;margin:0 0 16px}.field{display:block;font-size:13px;color:#57645c;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #d9ded7;border-radius:9px;font:inherit;background:#fff}button,.button{font:inherit;border:0;border-radius:9px;padding:11px 14px;cursor:pointer;font-weight:650;background:#e8eee7;color:#173c32}.primary{background:#1f6848;color:white;width:100%;margin-top:14px}.scan{display:flex;gap:8px;margin-top:8px}.scan button{white-space:nowrap}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab.active{background:#173c32;color:#fff}.list{display:grid;gap:8px}.row{display:flex;align-items:center;gap:12px;border:1px solid #edf0eb;border-radius:11px;padding:12px}.emoji{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#f1f4ed;font-size:20px}.info{flex:1;min-width:0}.info strong{display:block}.muted{font-size:12px;color:#76827a;margin-top:3px}.actions{display:flex;gap:6px}.empty{color:#7b867e;text-align:center;padding:28px}.remove{background:#f8ebe5;color:#94442a}.notice{font-size:13px;min-height:18px;color:#a34831}.sms{width:100%;background:#173c32;color:white;margin-top:13px}.scanner{width:100%;border-radius:12px;margin-top:12px;background:#111}.badge{background:#eff4eb;color:#407552;padding:4px 8px;border-radius:99px;font-size:11px}@media(max-width:720px){.layout{grid-template-columns:1fr}.wrap{margin-top:18px}.top{padding-left:20px}.stat,.panel{padding:15px}.row{padding:10px}.actions button{padding:9px}}
</style></head><body><header class="top"><div class="brand">VoorraadThuis · thuisinventaris</div><h1>Altijd weten wat er nog is.</h1><p>Houd je voorraad bij, scan producten en maak je boodschappenlijst.</p></header><main class="wrap"><section class="stats"><div class="stat">In huis<strong id="countHave">0</strong></div><div class="stat">Op boodschappenlijst<strong id="countNeed">0</strong></div></section><div class="layout"><section class="panel"><h2>Product toevoegen</h2><form id="addForm"><label class="field" for="name">Productnaam</label><input id="name" placeholder="Bijv. havermelk" required maxlength="120"><label class="field" for="barcode">Barcode <span class="muted">(optioneel)</span></label><div class="scan"><input id="barcode" inputmode="numeric" placeholder="Scan of typ barcode"><button type="button" id="scanBtn">▦ Scan</button></div><video id="camera" class="scanner" hidden playsinline></video><label class="field" for="quantity">Hoeveelheid</label><input id="quantity" type="number" min="0.01" step="any" value="1"><label class="field" for="unit">Eenheid</label><input id="unit" value="stuks" maxlength="24"><button class="primary">＋ Voeg toe aan voorraad</button></form><p class="notice" id="notice"></p><p class="muted">Barcodes worden lokaal opgeslagen; productnamen voer je zelf in.</p></section><section class="panel"><div class="tabs"><button class="tab active" data-view="have">In huis <span id="haveTab">0</span></button><button class="tab" data-view="need">Niet meer in huis <span id="needTab">0</span></button></div><div id="list" class="list"></div><div id="shoppingBox"></div></section></div></main><script>
const $=s=>document.querySelector(s);let state={have:[],need:[],view:'have'};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,options={}){const r=await fetch(url,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});const data=await r.json();if(!r.ok)throw Error(data.error||'Er ging iets mis');return data}async function load(){[state.have,state.need]=await Promise.all([api('/api/products'),api('/api/shopping')]);render()}function render(){const h=state.have.length,n=state.need.length;$('#countHave').textContent=h;$('#countNeed').textContent=n;$('#haveTab').textContent=h;$('#needTab').textContent=n;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.view===state.view));const items=state.view==='have'?state.have:state.need;$('#list').innerHTML=items.length?items.map(p=>`<article class="row"><div class="emoji">${state.view==='have'?'🥫':'🛒'}</div><div class="info"><strong>${esc(p.name)}</strong><div class="muted">${esc(p.quantity)} ${esc(p.unit)}${p.barcode?' · '+esc(p.barcode):''}</div></div><div class="actions">${state.view==='have'?`<button class="remove" data-consume="${p.id}" title="Op">Niet meer</button>`:`<button data-restore="${p.id}" title="Terug naar voorraad">↶</button><button class="remove" data-delete="${p.id}" title="Verwijderen">×</button>`}</div></article>`).join(''):'<div class="empty">'+(state.view==='have'?'Nog geen producten. Voeg hierboven iets toe.':'Alles is op voorraad. Goed bezig!')+'</div>';$('#shoppingBox').innerHTML=state.need.length?`<button class="sms" id="sms">✉ Stuur boodschappenlijst via SMS</button><p class="muted">Opent de berichten-app met de lijst ingevuld; controleer en verstuur daar zelf.</p>`:'';}
$('#addForm').addEventListener('submit',async e=>{e.preventDefault();try{await api('/api/products',{method:'POST',body:JSON.stringify({name:$('#name').value,barcode:$('#barcode').value,quantity:$('#quantity').value,unit:$('#unit').value})});e.target.reset();$('#quantity').value=1;$('#unit').value='stuks';$('#notice').textContent='Product toegevoegd.';await load()}catch(err){$('#notice').textContent=err.message}});document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{state.view=x.dataset.view;render()});$('#list').addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.dataset.consume)await api('/api/products/'+b.dataset.consume,{method:'PATCH',body:JSON.stringify({action:'consume'})});if(b.dataset.restore)await api('/api/products/'+b.dataset.restore,{method:'PATCH',body:JSON.stringify({action:'restore'})});if(b.dataset.delete)await api('/api/shopping/'+b.dataset.delete,{method:'DELETE'});await load()}catch(err){$('#notice').textContent=err.message}});$('#shoppingBox').addEventListener('click',e=>{if(e.target.id==='sms'){const text='Boodschappenlijst:\n'+state.need.map(p=>`• ${p.name} — ${p.quantity} ${p.unit}`).join('\n');location.href='sms:?&body='+encodeURIComponent(text)}});
let stream;$('#scanBtn').onclick=async()=>{const video=$('#camera');if(!('BarcodeDetector'in window)){ $('#notice').textContent='Deze browser ondersteunt geen barcodescanner. Typ de barcode handmatig.';return}try{if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;video.hidden=true;return}const detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','itf']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});video.srcObject=stream;video.hidden=false;await video.play();const scan=async()=>{if(!stream)return;try{const codes=await detector.detect(video);if(codes.length){$('#barcode').value=codes[0].rawValue;stream.getTracks().forEach(t=>t.stop());stream=null;video.hidden=true;$('#notice').textContent='Barcode gescand.';return}}catch{}requestAnimationFrame(scan)};scan()}catch(err){$('#notice').textContent='Camera niet beschikbaar. Controleer toestemming of typ de barcode.'}};load().catch(e=>$('#notice').textContent=e.message);
</script></body></html>
